version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gowmerce-postgres
    environment:
      POSTGRES_DB: gowmerce_db
      POSTGRES_USER: gowmerce_user
      POSTGRES_PASSWORD: gowmerce_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gowmerce_user -d gowmerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: